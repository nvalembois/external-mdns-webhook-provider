[package]
name = "mdns_webhook_provider"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "webhook_provider"
path = "src/main.rs"

[[bin]]
name = "mdns_server"
path = "src/mdns_server.rs"


[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full" ] }
regex = "1"
tracing = "0"
tracing-subscriber = "0"
futures = "0"
chrono = "0"
kube = { version = "4", features = ["runtime", "derive"] }
k8s-openapi = { version = "0", features = ["v1_35"] }
axum = { version="0", features = ["macros"] }
simple-dns = "0"
socket2 = "0"

[profile.release]
opt-level = "z"     # optimise pour la taille (utile pour scratch/distroless)
lto = true          # link-time optimization, réduit la taille et améliore les perfs
codegen-units = 1   # meilleure optimisation, compilation plus lente
panic = "abort"     # évite d'embarquer le code de unwinding, réduit la taille
strip = true        # supprime les symboles de debug automatiquement (Rust 1.59+)

[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=+crt-static"]
